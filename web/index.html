<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Методист — генерация конспектов уроков на базе YandexGPT">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Методист">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Theme color matching dark theme -->
  <meta name="theme-color" content="#0D0F14">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>Методист — Генератор конспектов</title>
  <link rel="manifest" href="manifest.json">

  <!-- Nunito Font -->
  <style>
    @font-face {
      font-family: 'Nunito';
      src: url('Nunito-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Nunito';
      src: url('Nunito-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0D0F14;
      color: #F8FAFC;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.25) 0%, transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.2) 0%, transparent 60%),
                  #0D0F14;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .orb {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7C5CFF, #6366F1);
      box-shadow: 0 0 36px rgba(124, 92, 255, 0.65);
      animation: pulse 1.6s infinite ease-in-out;
      margin-bottom: 24px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: #94A3B8;
      animation: pulse-text 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes pulse-text {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Flutter Renderer Detection -->
  <script>
    window.flutterWebRenderer = (function() {
      try {
        var canvas = document.createElement('canvas');
        return !!(
          window.WebGLRenderingContext &&
          (canvas.getContext('webgl') || canvas.getContext('experimental-webgl'))
        );
      } catch (e) {
        return false;
      }
    })() ? 'canvaskit' : 'html';
  </script>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="orb"></div>
    <div class="title">Методист</div>
    <div class="subtitle">Загрузка приложения...</div>
  </div>

  <script>
    function removeLoader() {
      const loader = document.getElementById('loading');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }

    // Modern Flutter first-frame event
    window.addEventListener('flutter-first-frame', removeLoader);

    // Mutation observer fallback
    var observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view') || 
          document.querySelector('flt-glass-pane') ||
          document.querySelector('canvas')?.getAttribute('data-flutter-view')) {
        setTimeout(removeLoader, 300);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout
    setTimeout(removeLoader, 8000);
  </script>
  <script src="flutter_bootstrap.js?v=20261022" async></script>
</body>
</html>
