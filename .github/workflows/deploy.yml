name: Deploy Metodist to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Activities & Topics Data
        run: |
          node scripts/validate_activities.js
          node scripts/validate_topics.js

      - name: Enable Web support
        run: flutter config --enable-web

      - name: Clean Flutter
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build web release
        run: flutter build web --release --base-href /annmetodist/ --no-tree-shake-icons

      - name: Validate JavaScript bundles
        run: |
          node --check web/pdfmake_helper.js
          node --check build/web/main.dart.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true

      - name: Success notice
        run: echo "Metodist successfully deployed to GitHub Pages!"
