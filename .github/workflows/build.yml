name: Сборка APK и PWA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Сборка APK и PWA Web
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установка Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Установка зависимостей
        run: flutter pub get

      # 1. Сборка PWA (Web)
      - name: Сборка PWA Web
        run: flutter build web --release --pwa-strategy=offline-first

      - name: Сохранение артефакта PWA
        uses: actions/upload-artifact@v4
        with:
          name: pwa-web-build
          path: build/web

      # 2. Сборка APK (Android)
      - name: Сборка APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Сохранение артефакта APK
        uses: actions/upload-artifact@v4
        with:
          name: metodist-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
