<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👑 PDF‑Конструктор – Тариф Директор</title>
  <link rel="stylesheet" href="css/pdf_editor.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="js/pdf_editor_enhanced.js"></script>
</head>
<body>
  <header class="top-bar">
    <button class="hamburger" id="toggleSidebar">&#9776;</button>
    <h1>👑 PDF‑Конструктор <span style="font-size:13px; opacity:0.85; font-weight:normal; margin-left:8px;">(Тариф Директор)</span></h1>
    <nav class="top-actions">
      <button id="saveBtn" title="Сохранить проект"><span class="icon">💾</span></button>
      <button id="exportBtn" title="Экспорт в PDF"><span class="icon">📄</span></button>
    </nav>
  </header>
  <aside class="sidebar" id="sidebar">
    <ul class="tool-list">
      <li class="tool-item" data-tool="mascot" title="Маскот / Совёнок"><span class="icon">🦉</span></li>
      <li class="tool-item" data-tool="background" title="Фон и водяной знак"><span class="icon">🖌️</span></li>
      <li class="tool-item" data-tool="font" title="Шрифт (ФГОС)"><span class="icon">✏️</span></li>
      <li class="tool-item" data-tool="border" title="Рамка листа"><span class="icon">📏</span></li>
      <li class="tool-item" data-tool="header" title="Шапка школы / QR-код"><span class="icon">🗂️</span></li>
    </ul>
  </aside>
  <main class="canvas-area" id="canvasArea">
    <div class="canvas-placeholder" id="canvas">
      <p>Перетащите элементы из боковой панели, чтобы собрать фирменную страницу урока для печати.</p>
    </div>
  </main>
  <section class="bottom-toolbar" id="bottomToolbar">
    <button data-action="addText" title="Текстовый блок"><span class="icon">🔤</span></button>
    <button data-action="addImage" title="Изображение / Схема"><span class="icon">🖼️</span></button>
    <button data-action="addShape" title="Поле для ответа"><span class="icon">⬛</span></button>
    <button data-action="undo" title="Отменить"><span class="icon">↩️</span></button>
    <button data-action="redo" title="Повторить"><span class="icon">↪️</span></button>
  </section>
</body>
</html>
