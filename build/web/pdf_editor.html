<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF‑Конструктор – Тариф Разработчик</title>
  <link rel="stylesheet" href="css/pdf_editor.css" />
  <script defer src="js/pdf_editor.js"></script>
</head>
<body>
  <header class="top-bar">
    <button class="hamburger" id="toggleSidebar">&#9776;</button>
    <h1>PDF‑Конструктор</h1>
    <nav class="top-actions">
      <button id="saveBtn" title="Сохранить"><span class="icon">💾</span></button>
      <button id="exportBtn" title="Экспортировать"><span class="icon">📄</span></button>
    </nav>
  </header>
  <aside class="sidebar" id="sidebar">
    <ul class="tool-list">
      <li class="tool-item" data-tool="mascot" title="Маскот"><span class="icon">🐱</span></li>
      <li class="tool-item" data-tool="background" title="Фон"><span class="icon">🖌️</span></li>
      <li class="tool-item" data-tool="font" title="Шрифт"><span class="icon">✏️</span></li>
      <li class="tool-item" data-tool="border" title="Рамка"><span class="icon">📏</span></li>
      <li class="tool-item" data-tool="header" title="Шапка"><span class="icon">🗂️</span></li>
    </ul>
  </aside>
  <main class="canvas-area" id="canvasArea">
    <div class="canvas-placeholder" id="canvas">
      <p>Перетащите элементы из боковой панели, чтобы собрать PDF‑страницу.</p>
    </div>
  </main>
  <section class="bottom-toolbar" id="bottomToolbar">
    <button data-action="addText" title="Текст"><span class="icon">🔤</span></button>
    <button data-action="addImage" title="Изображение"><span class="icon">🖼️</span></button>
    <button data-action="addShape" title="Фигура"><span class="icon">⬛</span></button>
    <button data-action="undo" title="Отменить"><span class="icon">↩️</span></button>
    <button data-action="redo" title="Повторить"><span class="icon">↪️</span></button>
  </section>
</body>
</html>
