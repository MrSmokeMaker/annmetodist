<html lang="ru">
<head>
  <base href="/annmetodist/">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Методист — генерация конспектов уроков на базе YandexGPT">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Методист">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Theme color matching dark theme -->
  <meta name="theme-color" content="#0D0F14">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>Методист — Генератор конспектов</title>
  <link rel="manifest" href="manifest.json">

  <!-- Nunito Font -->
  <style>
    @font-face {
      font-family: 'Nunito';
      src: url('Nunito-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Nunito';
      src: url('Nunito-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <style>
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #0D0F14;
      color: #F8FAFC;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.25) 0%, transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.2) 0%, transparent 60%),
                  #0D0F14;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .orb {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7C5CFF, #6366F1);
      box-shadow: 0 0 36px rgba(124, 92, 255, 0.65);
      animation: pulse 1.6s infinite ease-in-out;
      margin-bottom: 24px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: #94A3B8;
      animation: pulse-text 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes pulse-text {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Flutter Renderer Detection -->
  <script>
    window.flutterWebRenderer = (function() {
      try {
        var canvas = document.createElement('canvas');
        return !!(
          window.WebGLRenderingContext &&
          (canvas.getContext('webgl') || canvas.getContext('experimental-webgl'))
        );
      } catch (e) {
        return false;
      }
    })() ? 'canvaskit' : 'html';
  </script>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      try {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        if (window.Telegram.WebApp.setHeaderColor) {
          window.Telegram.WebApp.setHeaderColor('#0D0F14');
        }
        if (window.Telegram.WebApp.setBackgroundColor) {
          window.Telegram.WebApp.setBackgroundColor('#0D0F14');
        }
      } catch (e) {
        console.warn('Telegram WebApp init error:', e);
      }
    }
  </script>
</head>
<body>
    <div class="ambient-glow"></div>
  <div id="loading" class="loading-container">
    <div class="landing-card">
      <div class="orb">
        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
      </div>
      <div class="title">Методист</div>
      <div class="subtitle">Умный генератор конспектов занятий, рабочих листов и заданий на базе нейросетей</div>
      
      <div class="features-pill-row">
        <span class="feature-pill">✨ Конспекты по ФГОС</span>
        <span class="feature-pill">📄 Рабочие листы</span>
        <span class="feature-pill">📝 Домашка</span>
      </div>

      <div class="progress-bar-container" role="progressbar" aria-label="Загрузка приложения">
        <div class="progress-bar-value"></div>
      </div>
      <div class="loading-status">Загрузка модулей методиста...</div>
    </div>
  </div>

  <script>
    function removeLoader() {
      const loader = document.getElementById('loading');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }

    // Modern Flutter first-frame event
    window.addEventListener('flutter-first-frame', removeLoader);

    // Mutation observer fallback
    var observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view') || 
          document.querySelector('flt-glass-pane') ||
          document.querySelector('canvas')?.getAttribute('data-flutter-view')) {
        setTimeout(removeLoader, 300);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout
    setTimeout(removeLoader, 8000);

    // Prevent mobile browser scroll/pinch drift causing tap offset
    window.addEventListener('scroll', function() {
      if (window.scrollY !== 0 || window.scrollX !== 0) {
        window.scrollTo(0, 0);
      }
    }, { passive: true });
    window.addEventListener('resize', function() {
      window.scrollTo(0, 0);
    });
  </script>
    <!-- Metodist Web Audio & Speech Synthesis Engine -->
  <script>
    window.MetodistAudio = {
      playSchoolBell: function() {
        try {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          var ctx = new AudioContextClass();
          var t = ctx.currentTime;

          var osc1 = ctx.createOscillator();
          var osc2 = ctx.createOscillator();
          var gain = ctx.createGain();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(1175, t); // D6
          osc1.frequency.exponentialRampToValueAtTime(784, t + 1.2); // G5

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(1568, t); // G6
          osc2.frequency.exponentialRampToValueAtTime(1046, t + 1.2);

          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(t);
          osc2.start(t);
          osc1.stop(t + 1.2);
          osc2.stop(t + 1.2);
        } catch(e) {
          console.warn('School bell audio error:', e);
        }
      },

      playClickGong: function() {
        try {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          var ctx = new AudioContextClass();
          var t = ctx.currentTime;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, t);
          osc.frequency.exponentialRampToValueAtTime(440, t + 0.35);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.35);
        } catch(e) {}
      },

      speak: function(text, rate, pitch) {
        if (!('speechSynthesis' in window)) {
          return false;
        }
        window.speechSynthesis.cancel();
        if (!text || text.trim() === '') return false;
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'ru-RU';
        u.rate = rate || 1.0;
        u.pitch = pitch || 1.0;

        var voices = window.speechSynthesis.getVoices();
        var ruVoices = voices.filter(function(v) { return v.lang && v.lang.indexOf('ru') === 0; });
        if (ruVoices.length > 0) {
          var preferred = ruVoices.find(function(v) {
            return v.name.indexOf('Google') !== -1 || v.name.indexOf('Natural') !== -1 || v.name.indexOf('Yandex') !== -1;
          }) || ruVoices[0];
          u.voice = preferred;
        }

        u.onstart = function() {
          window.dispatchEvent(new CustomEvent('metodist-speech-start', { detail: { text: text } }));
        };
        u.onend = function() {
          window.dispatchEvent(new CustomEvent('metodist-speech-end'));
        };
        u.onerror = function() {
          window.dispatchEvent(new CustomEvent('metodist-speech-end'));
        };

        window.speechSynthesis.speak(u);
        return true;
      },

      pause: function() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.pause();
        }
      },

      resume: function() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.resume();
        }
      },

      stop: function() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      },

      isSpeaking: function() {
        return 'speechSynthesis' in window && window.speechSynthesis.speaking;
      }
    };
  </script>

  <script src="flutter_bootstrap.js?v=1793292149186" async></script>
</body>
</html>
