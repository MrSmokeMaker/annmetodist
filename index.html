    .loading-card {

    .owl-halo {

      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, rgba(245, 158, 11, 0.15) 50%, transparent 70%);
      filter: blur(14px);
      animation: haloPulse 2.8s ease-in-out infinite;
    }
    .owl-svg {
      width: 112px;
      height: 112px;
      position: relative;
      z-index: 2;
      animation: owlFloat 3s ease-in-out infinite;
      transform-origin: center bottom;
    }
    .speech-bubble {
      position: relative;
      background: rgba(30, 27, 75, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(245, 158, 11, 0.55);
      border-radius: 16px;
      padding: 10px 16px;
      color: #F1F5F9;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(245, 158, 11, 0.2);
      margin-bottom: 22px;
      min-height: 22px;
      max-width: 290px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 8px 8px 8px;
      border-style: solid;
      border-color: transparent transparent rgba(245, 158, 11, 0.7) transparent;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 7px 7px 7px;
      border-style: solid;
      border-color: transparent transparent rgba(30, 27, 75, 0.95) transparent;
    }
    .progress-bar-container {
      width: 160px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-value {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #10B981, #06B6D4, #6366F1);
      border-radius: 99px;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
      animation: barSlide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes owlFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }
    @keyframes haloPulse {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes barSlide {
      0% { left: -45%; }
      100% { left: 100%; }
    }
    @keyframes owlBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }
    @keyframes owlBeak {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.3); }
    }
    @keyframes owlWing {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes tasselSwing {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(14deg); }
    }
      50% { opacity: 1; }
    }
  </style>

  <script>
    function removeLoader() {
      const loader = document.getElementById('loading');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }

    // Modern Flutter first-frame event
    window.addEventListener('flutter-first-frame', removeLoader);

    // Mutation observer fallback
    var observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view') || 
          document.querySelector('flt-glass-pane') ||
          document.querySelector('canvas')?.getAttribute('data-flutter-view')) {
        setTimeout(removeLoader, 300);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout
    setTimeout(removeLoader, 8000);

    // Prevent mobile browser scroll/pinch drift causing tap offset
    window.addEventListener('scroll', function() {
      if (window.scrollY !== 0 || window.scrollX !== 0) {
        window.scrollTo(0, 0);
      }
    }, { passive: true });
    window.addEventListener('resize', function() {
      window.scrollTo(0, 0);
    });
  </script>
    <!-- Metodist Web Audio & Speech Synthesis Engine -->
  <script>
    window.MetodistAudio = {
      playSchoolBell: function() {
        try {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          var ctx = new AudioContextClass();
          var t = ctx.currentTime;

          var osc1 = ctx.createOscillator();
          var osc2 = ctx.createOscillator();
          var gain = ctx.createGain();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(1175, t); // D6
          osc1.frequency.exponentialRampToValueAtTime(784, t + 1.2); // G5

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(1568, t); // G6
          osc2.frequency.exponentialRampToValueAtTime(1046, t + 1.2);

          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(t);
          osc2.start(t);
          osc1.stop(t + 1.2);
          osc2.stop(t + 1.2);
        } catch(e) {
          console.warn('School bell audio error:', e);
        }
      },

      playClickGong: function() {
        try {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          var ctx = new AudioContextClass();
          var t = ctx.currentTime;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, t);
          osc.frequency.exponentialRampToValueAtTime(440, t + 0.35);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.35);
        } catch(e) {}
      },

      speak: function(text, rate, pitch) {
        if (!('speechSynthesis' in window)) {
          return false;
        }
        window.speechSynthesis.cancel();
        if (!text || text.trim() === '') return false;
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'ru-RU';
        u.rate = rate || 1.0;
        u.pitch = pitch || 1.0;

        var voices = window.speechSynthesis.getVoices();
        var ruVoices = voices.filter(function(v) { return v.lang && v.lang.indexOf('ru') === 0; });
        if (ruVoices.length > 0) {
          var preferred = ruVoices.find(function(v) {
            return v.name.indexOf('Google') !== -1 || v.name.indexOf('Natural') !== -1 || v.name.indexOf('Yandex') !== -1;
          }) || ruVoices[0];
          u.voice = preferred;
        }

        u.onstart = function() {
          window.dispatchEvent(new CustomEvent('metodist-speech-start', { detail: { text: text } }));
        };
        u.onend = function() {
          window.dispatchEvent(new CustomEvent('metodist-speech-end'));
        };
        u.onerror = function() {
          window.dispatchEvent(new CustomEvent('metodist-speech-end'));
        };

        window.speechSynthesis.speak(u);
        return true;
      },

      pause: function() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.pause();
        }
      },

      resume: function() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.resume();
        }
      },

      stop: function() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      },

      isSpeaking: function() {
        return 'speechSynthesis' in window && window.speechSynthesis.speaking;
      }
    };
  </script>
