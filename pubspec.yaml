name: metodist
description: "Мобильное приложение для генерации конспектов занятий с помощью YandexGPT API"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Backend, Auth & Local Storage
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.2.2  # Replaced flutter_secure_storage for web compatibility

  # Document Generation & Sharing
  pdf: ^3.11.1
  http: ^1.1.0
  printing: ^5.13.2
  share_plus: ^10.1.2

  # UI, Styling & Animations
  flutter_animate: ^4.5.2
  flutter_markdown: ^0.7.4+1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  archive: ^4.5.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/pdf_icons/
