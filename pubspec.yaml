name: metodist
description: "Мобильное приложение для генерации конспектов занятий с помощью YandexGPT API"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Database & Secure Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Document Generation & Sharing
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.2

  # UI, Styling & Animations
  flutter_animate: ^4.5.2
  flutter_markdown: ^0.7.4+1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/data/
